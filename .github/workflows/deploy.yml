name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许本工作流向 GitHub Pages 发布
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时自动创建站点（需要 pages: write 权限，本工作流已声明）。
          # 这样 clone / fork 之后直接 push 就能上线，不必先去 Settings 里点一次。
          enablement: true

      - name: 打包产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
